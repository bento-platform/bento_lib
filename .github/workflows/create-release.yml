name: Create Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 18.5.0 (must match pyproject.toml)'
        required: true
        type: string

jobs:
  tag-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v7

      - name: Validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid version: ${INPUT_VERSION}" >&2
            exit 1
          fi
          # The published package version comes from pyproject.toml, so they must agree.
          pyproject_version=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [[ "${version}" != "${pyproject_version}" ]]; then
            echo "Input version ${version} does not match pyproject.toml version ${pyproject_version}." >&2
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Fail if tag already exists
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; bump the version first." >&2
            exit 1
          fi

      - name: Create tag and GitHub release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes

  # Releases created with GITHUB_TOKEN do not trigger the `release: published`
  # event, so call the publish workflow explicitly.
  publish:
    needs: tag-and-release
    uses: ./.github/workflows/release.yml
    secrets: inherit
