name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 18.5.0 (pyproject.toml is updated to this)'
        required: true
        type: string

jobs:
  tag-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v7

      - name: Validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid version: ${INPUT_VERSION}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Fail if tag already exists
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists." >&2
            exit 1
          fi

      - name: Update version in pyproject.toml and commit
        id: bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          perl -0pi -e 's/^version = ".*"/version = "$ENV{VERSION}"/m' pyproject.toml
          if git diff --quiet pyproject.toml; then
            echo "pyproject.toml already at ${VERSION}; no bump commit needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: bump version to ${VERSION}" pyproject.toml
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.bump.outputs.sha }}
        run: |
          gh release create "${TAG}" \
            --target "${SHA}" \
            --title "${TAG}" \
            --generate-notes

  publish:
    needs: tag-and-release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag-and-release.outputs.tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Set token
        run: python -m poetry config pypi-token.pypi ${{ secrets.PYPI_API_TOKEN }}

      - name: Build and publish to PyPI
        run: python -m poetry publish --build
